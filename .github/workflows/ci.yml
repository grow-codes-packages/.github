name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    name: CI
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate profile and community files
        run: |
          python3 -m venv "$RUNNER_TEMP/community-venv"
          "$RUNNER_TEMP/community-venv/bin/python" -m pip install PyYAML==6.0.3
          "$RUNNER_TEMP/community-venv/bin/python" scripts/validate-community.py
